<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Agent 21 chart</title>
    <!-- The Chart Library's chart page in its embedded layout. Element ids match
       chart.html, which the renderer expects; viewer.js supplies the data. -->
    <link rel="stylesheet" href="assets/chart.css" />
    <script defer src="assets/lightweight-charts.js"></script>
    <script defer src="viewer.js"></script>
  </head>
  <body class="embedded">
    <main>
      <section class="chart-card" aria-label="Chart">
        <div class="toolbar">
          <div
            class="button-group"
            id="ranges"
            aria-label="Visible date range"
          ></div>
          <div
            class="button-group"
            id="flow-intervals"
            aria-label="Flow frequency"
            hidden
          ></div>
          <div class="chart-actions">
            <div id="bitcoin-controls" class="button-group" hidden>
              <label class="axis-control"
                >Bitcoin
                <select id="bitcoin-style" aria-label="Bitcoin display">
                  <option value="line">Line</option>
                  <option value="candles">Candles</option>
                </select></label
              ><label id="interval-control" class="axis-control" hidden
                >Interval
                <select id="candle-interval" aria-label="Candle interval">
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                </select></label
              >
            </div>
            <div
              class="button-group"
              id="scales"
              aria-label="Axis scales"
            ></div>
            <button id="events" aria-pressed="true">Events</button
            ><button id="reset">Reset</button
            ><button id="export" class="export">
              Export PNG <span aria-hidden="true">↗</span>
            </button>
          </div>
        </div>
        <div class="chart-layout">
          <div class="plot-wrap">
            <div class="plot-label" id="plot-label"></div>
            <div
              id="chart"
              role="img"
              aria-label="Chart. Exact values and series controls are in the adjacent panel."
            ></div>
            <div id="loading" role="status">Loading chart data…</div>
          </div>
          <aside
            class="indicators"
            aria-label="Data series values and visibility"
          >
            <div class="panel-heading">
              <h2>DATA SERIES</h2>
              <div class="series-actions">
                <button id="show-all" class="text-button">Show all</button
                ><button id="remove-all" class="text-button">Remove all</button>
              </div>
            </div>
            <div class="reading-date">
              <span id="reading-mode">REPORT DATE</span
              ><strong id="reading-date"></strong>
            </div>
            <div id="candle-reading" class="candle-reading" hidden></div>
            <div id="legend"></div>
            <p class="legend-hint">
              Select a series to show or hide it.<br />Move across the chart to
              compare values.
            </p>
          </aside>
        </div>
        <div class="chart-foot">
          <span id="view-range"></span
          ><span
            >Scroll to zoom · Drag to explore · Double-click price axis to
            fit</span
          >
        </div>
      </section>
      <div class="below-chart">
        <p>
          <span id="chart-source"></span><br /><span
            id="observation-note"
          ></span>
        </p>
        <a href="#" id="download-data"
          >Download chart data <span aria-hidden="true">↓</span></a
        >
      </div>
      <details class="events-list">
        <summary>Historical events in this chart</summary>
        <ul id="event-list"></ul>
      </details>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="below-chart">
        <a href="https://www.tradingview.com/" target="_blank" rel="noopener"
          >Charts by TradingView</a
        >
      </p>
    </main>
  </body>
</html>
